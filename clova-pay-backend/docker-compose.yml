version: "3.8"

services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/clovapay?schema=public
      - NODE_ENV=production
    depends_on:
      - db
    networks:
      - clovapay-network

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=clovapay
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - clovapay-network

networks:
  clovapay-network:
    driver: bridge

volumes:
  postgres_data:
